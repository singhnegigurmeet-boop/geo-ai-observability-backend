services:
  migrate:
    build: .
    container_name: geo-migrate
    command: node dist/common/database/migrate.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: geo-api
    command: node dist/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      ENABLE_REAL_PROVIDERS: ${ENABLE_REAL_PROVIDERS:-false}
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-dispatcher:
    build: .
    container_name: geo-outbox-dispatcher
    command: node dist/modules/outbox/entrypoints/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      USER_SESSION_TTL_SECONDS: 2592000
      ANONYMOUS_SESSION_TTL_SECONDS: 604800
      OUTBOX_BATCH_SIZE: 25
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_LOCK_TIMEOUT_MS: 60000
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-run-worker:
    build: .
    container_name: geo-analysis-run-worker
    command: node dist/modules/analysis/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      ANALYSIS_RUN_WORKER_PREFETCH: 5
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-run-item-worker:
    build: .
    container_name: geo-analysis-run-item-worker
    command: node dist/modules/analysis/entrypoints/run-item-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      ANALYSIS_RUN_ITEM_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  classification-worker:
    build: .
    container_name: geo-classification-worker
    command: node dist/modules/analysis/entrypoints/run-classification-worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      CLASSIFICATION_WORKER_PREFETCH: 5
      CLASSIFICATION_PROVIDER: ${CLASSIFICATION_PROVIDER:-mock}
      CLASSIFICATION_MODEL: ${CLASSIFICATION_MODEL:-mock-fast}
      ENABLE_REAL_PROVIDERS: ${ENABLE_REAL_PROVIDERS:-false}
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  classification-result-worker:
    build: .
    container_name: geo-classification-result-worker
    command: node dist/modules/analysis/entrypoints/run-classification-result-worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      CLASSIFICATION_WORKER_PREFETCH: 5
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  llm-run-worker:
    build: .
    container_name: geo-llm-run-worker
    command: node dist/modules/llm/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      LLM_RUN_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prompt-worker:
    build: .
    container_name: geo-prompt-worker
    command: node dist/modules/prompts/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      PROMPT_WORKER_PREFETCH: 10
      ENABLE_REAL_PROVIDERS: ${ENABLE_REAL_PROVIDERS:-false}
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mock-provider-worker:
    build: .
    container_name: geo-mock-provider-worker
    command: node dist/modules/providers/entrypoints/run-mock-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      MOCK_PROVIDER_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  openai-provider-worker:
    profiles: ["real-providers"]
    build: .
    command: node dist/modules/providers/entrypoints/run-provider-worker.js openai
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      ENABLE_REAL_PROVIDERS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-30000}
      REAL_PROVIDER_WORKER_PREFETCH: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gemini-provider-worker:
    profiles: ["real-providers"]
    build: .
    command: node dist/modules/providers/entrypoints/run-provider-worker.js gemini
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      ENABLE_REAL_PROVIDERS: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
      REAL_PROVIDER_WORKER_PREFETCH: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  claude-provider-worker:
    profiles: ["real-providers"]
    build: .
    command: node dist/modules/providers/entrypoints/run-provider-worker.js claude
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      ENABLE_REAL_PROVIDERS: "true"
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_TIMEOUT_MS: ${CLAUDE_TIMEOUT_MS:-30000}
      REAL_PROVIDER_WORKER_PREFETCH: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scoring-worker:
    build: .
    container_name: geo-scoring-worker
    command: node dist/modules/scoring/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      SCORING_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler-worker:
    build: .
    container_name: geo-scheduler-worker
    command: node dist/modules/scheduler/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      ENABLE_REAL_PROVIDERS: ${ENABLE_REAL_PROVIDERS:-false}
      SCHEDULER_BATCH_SIZE: 25
      SCHEDULER_POLL_INTERVAL_MS: 5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  notification-worker:
    build: .
    container_name: geo-notification-worker
    command: node dist/modules/notifications/entrypoints/run-worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      NOTIFICATION_WORKER_PREFETCH: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo_observability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_observability"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: geo-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo_observability_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_observability_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: geo-rabbitmq
    hostname: geo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  rabbitmq-test:
    image: rabbitmq:4.1-management-alpine
    container_name: geo-rabbitmq-test
    hostname: geo-rabbitmq-test
    profiles: ["test"]
    environment:
      RABBITMQ_ERLANG_COOKIE: geo-v6-test-only-erlang-cookie
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 10s
      retries: 30

volumes:
  postgres_data:
  rabbitmq_data:
