services:
  api:
    build: .
    container_name: geo-api
    command: node dist/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  outbox-dispatcher:
    build: .
    container_name: geo-outbox-dispatcher
    command: node dist/outbox/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
      USER_SESSION_TTL_SECONDS: 2592000
      ANONYMOUS_SESSION_TTL_SECONDS: 604800
      OUTBOX_BATCH_SIZE: 25
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_LOCK_TIMEOUT_MS: 60000
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-run-worker:
    build: .
    container_name: geo-analysis-run-worker
    command: node dist/analysis-worker/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      ANALYSIS_RUN_WORKER_PREFETCH: 5
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-run-item-worker:
    build: .
    container_name: geo-analysis-run-item-worker
    command: node dist/analysis-item-worker/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      ANALYSIS_RUN_ITEM_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  llm-run-worker:
    build: .
    container_name: geo-llm-run-worker
    command: node dist/llm-run-worker/main.js
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geo_observability
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672?heartbeat=30
      RABBITMQ_EXCHANGE: geo.v6.main
      RABBITMQ_DEAD_LETTER_EXCHANGE: geo.v6.dlx
      RABBITMQ_CONFIRM_TIMEOUT_MS: 10000
      LLM_RUN_WORKER_PREFETCH: 10
      SESSION_TOKEN_PEPPER: local-development-session-pepper-change-me
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo_observability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_observability"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: geo-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geo_observability_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_observability_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: geo-rabbitmq
    hostname: geo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  rabbitmq-test:
    image: rabbitmq:4.1-management-alpine
    container_name: geo-rabbitmq-test
    hostname: geo-rabbitmq-test
    profiles: ["test"]
    environment:
      RABBITMQ_ERLANG_COOKIE: geo-v6-test-only-erlang-cookie
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: geo-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: geo-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  elasticsearch_data:
